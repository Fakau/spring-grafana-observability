global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: 'app_sns'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'app_sns:8081' ]
        labels:
          application: 'sns application'

  - job_name: 'app_fco'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'app_fco:8082' ]
        labels:
          application: 'fco application'
